# Xcode project of the iPhone app, generated by XcodeGen (`xcodegen generate`), so no
# .xcodeproj is kept in git. The app is a small Swift shell around the shared Compose
# app (the RecordLabsShared framework built by Gradle). See build-ipa.sh.
name: RecordLabs
options:
  bundleIdPrefix: com.recordlabs
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "2.0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RecordLabs:
    type: application
    platform: iOS
    sources:
      - iosApp
      # The app's pictures and fonts (the desktop's src/main/resources), copied by
      # build-ipa.sh as the "AppAssets" folder. Not "resources": iOS reads a bundle
      # with a Resources folder as an old-style bundle and then finds no Info.plist
      # ("Missing bundle ID" when installing).
      - path: build/AppAssets
        type: folder
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Record Labs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # White status bar text on the app's dark pages.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose draws at the screen's full refresh rate (ProMotion).
        CADisableMinimumFrameDurationOnPhone: true
        # Record Labs Connect finds the account's other devices on the same Wi-Fi.
        NSLocalNetworkUsageDescription: Record Labs Connect finds your computers and phones on this Wi-Fi so you can play music on them and control them from here.
        # Music keeps playing in the background and on the lock screen.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recordlabs.ios
        # The app icon (iosApp/Assets.xcassets): the same orange "R" as Android and the desktop.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        # The shared app (Kotlin/Compose), built by Gradle before Xcode runs.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework
        OTHER_LDFLAGS: ["-framework", "RecordLabsShared"]
        # Sideloadly signs the app with your Apple ID; the .ipa is built unsigned.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
