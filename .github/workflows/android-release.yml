name: Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (for example 1.9.1)"
        required: true
        default: "1.9.1"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Gradle wrapper for Linux
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.9.${GITHUB_RUN_NUMBER}"
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((190000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RECORDLABS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing RECORDLABS_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/recordlabs.keystore"

      - name: Build signed FOSS APK
        env:
          RECORDLABS_VERSION_NAME: ${{ steps.version.outputs.version }}
          RECORDLABS_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RECORDLABS_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/recordlabs.keystore
          RECORDLABS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.RECORDLABS_KEYSTORE_PASSWORD }}
          RECORDLABS_DEBUG_KEY_ALIAS: ${{ secrets.RECORDLABS_KEY_ALIAS }}
          RECORDLABS_DEBUG_KEY_PASSWORD: ${{ secrets.RECORDLABS_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleFossDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvm.options="-Xmx2048m" \
            --stacktrace 2>&1 | tee gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            COMPILER_ERRORS="$(grep -E '(^e: |(^|[[:space:]])error:|Unresolved reference|Compilation error)' gradle-build.log | tail -n 50 || true)"
            GRADLE_FAILURE="$(awk '
              /FAILURE: Build failed/ { capture = 1 }
              capture { print; lines++ }
              lines == 20 { exit }
            ' gradle-build.log)"
            FAILURE_DETAILS="${COMPILER_ERRORS}${COMPILER_ERRORS:+$'\n\n'}${GRADLE_FAILURE}"
            if [[ -z "$FAILURE_DETAILS" ]]; then
              FAILURE_DETAILS="$(tail -n 40 gradle-build.log)"
            fi
            {
              echo "### Gradle build failure"
              echo '```text'
              echo "$FAILURE_DETAILS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            DETAILS="$(echo "$FAILURE_DETAILS" | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')"
            echo "::error title=Gradle build failed::$DETAILS"
            exit "$BUILD_STATUS"
          fi

      - name: Prepare release files
        id: files
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK="Record-Labs-${VERSION}-foss.apk"
          cp "app/build/outputs/apk/foss/debug/Record Labs-foss-debug.apk" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.files.outputs.apk }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "Record Labs ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
