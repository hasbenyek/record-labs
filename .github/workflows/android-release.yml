name: Android release

# A push to main whose versionName (androidApp/build.gradle.kts) has no release yet,
# or a pushed tag v1.2.3, builds the optimised Android app (R8, resource shrinking, baseline profile) and publishes it as
# the repository's latest release:
#   Record-Labs-<version>.apk and Record-Labs-<version>.apk.sha256
#
# The app is built as com.recordlabs.music and signed with the key of the 1.9.x
# releases (repository secrets), so it installs over them as an update. The 1.9.x app
# reads /releases/latest (a newer tag, an .apk and a .sha256 file) and shows an update
# notification; 2.x shows its own update banner.
#
# Secrets: RECORDLABS_KEYSTORE_BASE64, RECORDLABS_KEYSTORE_PASSWORD,
# RECORDLABS_KEY_ALIAS, RECORDLABS_KEY_PASSWORD, LISTEN_TOGETHER_KEY.

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Certificate of the 1.9.x releases: a release signed with another key could not be
  # installed over them, so the build stops instead of publishing it.
  EXPECTED_SIGNER_SHA256: 823ee06270769c769aca40d81948decbcd4f92cdbfdf5d176577cf8e4c4a9830

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' androidApp/build.gradle.kts | tr -d '\r' | head -1)"
          test -n "$v" || { echo "::error::No appVersionName in androidApp/build.gradle.kts"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          # main: only a version that is not released yet (raise versionName to release).
          publish=true
          if [[ "$GITHUB_REF" == refs/heads/* ]] && gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released: nothing to do"; publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RECORDLABS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing RECORDLABS_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/recordlabs.keystore"

      - name: Build the release APK
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          RECORDLABS_APPLICATION_ID: com.recordlabs.music
          RL_RELEASE_STORE_FILE: ${{ runner.temp }}/recordlabs.keystore
          RL_RELEASE_STORE_PASSWORD: ${{ secrets.RECORDLABS_KEYSTORE_PASSWORD }}
          RL_RELEASE_KEY_ALIAS: ${{ secrets.RECORDLABS_KEY_ALIAS }}
          RL_RELEASE_KEY_PASSWORD: ${{ secrets.RECORDLABS_KEY_PASSWORD }}
          LISTEN_TOGETHER_KEY: ${{ secrets.LISTEN_TOGETHER_KEY }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          set +e
          ./gradlew :androidApp:assembleRelease \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvm.options="-Xmx3g" 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            # The failure as an annotation (shown on the run's summary page).
            details="$( (grep -E '^e: |error:|What went wrong' -A3 gradle-build.log | head -60; echo; tail -n 25 gradle-build.log) | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')"
            echo "::error title=Android build failed::$details"
            exit "$status"
          fi

      - name: Check the signature and package
        if: steps.version.outputs.publish == 'true'
        id: files
        shell: bash
        run: |
          APK_IN="$(ls androidApp/build/outputs/apk/release/*.apk | head -1)"
          test -f "$APK_IN" || { echo "::error::No release APK was built"; exit 1; }
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_IN" | tee signer.txt
          SIGNER="$(sed -n 's/.*certificate SHA-256 digest: //p' signer.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          if [[ "$SIGNER" != "$EXPECTED_SIGNER_SHA256" ]]; then
            echo "::error::The APK is not signed with the key of the 1.9.x releases ($SIGNER)"; exit 1
          fi
          "$BUILD_TOOLS/aapt2" dump badging "$APK_IN" | head -1 | tee badging.txt
          grep -q "name='com.recordlabs.music'" badging.txt || { echo "::error::Wrong application id"; exit 1; }
          APK="Record-Labs-${{ steps.version.outputs.version }}.apk"
          cp "$APK_IN" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.files.outputs.apk }}"
          NOTES=".github/release-notes/android-${{ steps.version.outputs.version }}.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "Record Labs ${{ steps.version.outputs.version }}" \
              "${NOTES_ARGS[@]}" --latest
          fi
