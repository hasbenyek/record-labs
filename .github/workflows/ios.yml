name: iOS app (.ipa)

# The iPhone app (in progress), built on a Mac runner as an unsigned .ipa to install
# with Sideloadly. It runs on the ios-port branch (and by hand); it publishes no
# release and does not touch the Android release, which comes from main.
on:
  push:
    branches: ['ios-port']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Tools
        run: brew install xcodegen

      - name: Build the .ipa
        shell: bash
        env:
          LISTEN_TOGETHER_KEY: ${{ secrets.LISTEN_TOGETHER_KEY }}
        run: |
          sed -i '' 's/\r$//' gradlew iosApp/build-ipa.sh
          chmod +x gradlew iosApp/build-ipa.sh
          ./gradlew --no-daemon :shared:buildIosIpa -Precordlabs.ios=true \
            -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Record-Labs-iOS
          path: build/ios/*.ipa
          if-no-files-found: error
